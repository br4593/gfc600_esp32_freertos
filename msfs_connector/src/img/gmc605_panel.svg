<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 159 41.969002" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/>
      <stop offset="0.5" stop-color="#1a1f24"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a06"/>
      <stop offset="1" stop-color="#0a120b"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d343b"/>
      <stop offset="1" stop-color="#11161a"/>
    </linearGradient>
    <linearGradient id="lvlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a34c22"/>
      <stop offset="1" stop-color="#3a170c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.3" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer bezel -->
  <rect x="0.3" y="0.3" width="158.4" height="41.37" rx="2.2" fill="url(#bezelGrad)" filter="url(#softShadow)"/>
  <rect x="0.3" y="0.3" width="158.4" height="41.37" rx="2.2" fill="none" stroke="#3a424a" stroke-width="0.25" stroke-opacity="0.8"/>

  <!-- Inner recessed face -->
  <rect x="1.3" y="1.3" width="156.4" height="39.37" rx="1.6" fill="#14191e"/>

  <!-- GARMIN wordmark -->
  <text x="79.5" y="3.0" fill="#cbd3da" font-size="1.6" letter-spacing="0.3" text-anchor="middle">GARMIN</text>
  <!-- GMC 605 engraved label -->
  <text x="118.9" y="29.6" fill="#8c949c" font-size="1.5" letter-spacing="0.2" text-anchor="middle">GMC 605</text>

  <!-- LCD glass -->
  <rect x="23.91" y="3.96" width="86.73" height="21.65" rx="0.8" fill="url(#lcdGrad)"/>
  <rect x="23.91" y="3.96" width="86.73" height="21.65" rx="0.8" fill="none" stroke="#182018" stroke-width="0.3"/>
  <line x1="48.2" y1="4.5" x2="48.2" y2="25.07" stroke="#1c2a1d" stroke-width="0.15" stroke-opacity="0.5"/>
  <line x1="79.6" y1="4.5" x2="79.6" y2="25.07" stroke="#1c2a1d" stroke-width="0.15" stroke-opacity="0.5"/>

  <!-- KEYS -->
  <!-- helper: each key = rect + top highlight + label -->
  <!-- AP -->
  <g>
    <rect x="8.89" y="3.38" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="9.5" y1="3.85" x2="17.77" y2="3.85" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="13.635" y="7.03" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">AP</text>
  </g>
  <!-- FD -->
  <g>
    <rect x="8.89" y="17.38" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="9.5" y1="17.85" x2="17.77" y2="17.85" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="13.635" y="21.03" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">FD</text>
  </g>
  <!-- YD -->
  <g>
    <rect x="8.89" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="9.5" y1="31.73" x2="17.77" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="13.635" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">YD</text>
  </g>
  <!-- HDG -->
  <g>
    <rect x="25.55" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="26.16" y1="31.73" x2="34.43" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="30.295" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">HDG</text>
  </g>
  <!-- NAV -->
  <g>
    <rect x="41.88" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="42.49" y1="31.73" x2="50.76" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="46.625" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">NAV</text>
  </g>
  <!-- APR -->
  <g>
    <rect x="58.38" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="58.99" y1="31.73" x2="67.26" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="63.125" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">APR</text>
  </g>
  <!-- BC -->
  <g>
    <rect x="75.13" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="75.74" y1="31.73" x2="84.01" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="79.875" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">BC</text>
  </g>
  <!-- VNV -->
  <g>
    <rect x="92.89" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="93.5" y1="31.73" x2="101.77" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="97.635" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">VNV</text>
  </g>
  <!-- IAS -->
  <g>
    <rect x="109.26" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="109.87" y1="31.73" x2="118.14" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="114.005" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">IAS</text>
  </g>
  <!-- VS -->
  <g>
    <rect x="125.88" y="31.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="126.49" y1="31.73" x2="134.76" y2="31.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="130.625" y="34.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">VS</text>
  </g>
  <!-- ALT -->
  <g>
    <rect x="125.88" y="17.26" width="9.49" height="7.30" rx="0.9" fill="url(#keyGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="126.49" y1="17.73" x2="134.76" y2="17.73" stroke="#454e57" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="130.625" y="20.91" fill="#eef3f6" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">ALT</text>
  </g>
  <!-- LVL (amber) -->
  <g>
    <rect x="125.88" y="3.38" width="9.49" height="7.30" rx="0.9" fill="url(#lvlGrad)" stroke="#3b444d" stroke-width="0.12"/>
    <line x1="126.49" y1="3.85" x2="134.76" y2="3.85" stroke="#d98a5a" stroke-width="0.2" stroke-opacity="0.6"/>
    <text x="130.625" y="7.03" fill="#ffffff" font-size="3.0" font-weight="700" text-anchor="middle" dominant-baseline="central">LVL</text>
  </g>

  <!-- LED DOTS -->
  <circle cx="5.44" cy="7.13" r="0.72" fill="#1c2020" stroke="#000000" stroke-width="0.1"/>
  <circle cx="5.44" cy="21.18" r="0.72" fill="#1c2020" stroke="#000000" stroke-width="0.1"/>
  <circle cx="5.44" cy="34.81" r="0.72" fill="#1c2020" stroke="#000000" stroke-width="0.1"/>

  <!-- NOSE UP / DN trim rocker -->
  <rect x="139.8" y="11.5" width="3.4" height="19" rx="0.8" fill="#0f1317" stroke="#2a2f35" stroke-width="0.12"/>
  <!-- Down triangle (points down) at cy=14.02 -->
  <polygon points="140.55,13.07 142.45,13.07 141.5,14.97" fill="#cfd7dc"/>
  <text x="141.5" y="11.9" fill="#9aa3ab" font-size="1.4" text-anchor="middle">DN</text>
  <!-- Up triangle (points up) at cy=28.58 -->
  <polygon points="141.5,27.63 142.45,29.53 140.55,29.53" fill="#cfd7dc"/>
  <text x="141.5" y="31.1" fill="#9aa3ab" font-size="1.4" text-anchor="middle">UP</text>

  <!-- MOUNT HOLES -->
  <circle cx="4.5" cy="14.2" r="0.6" fill="#0a0c0e" stroke="#2a2f35" stroke-width="0.1"/>
  <circle cx="4.5" cy="28.0" r="0.6" fill="#0a0c0e" stroke="#2a2f35" stroke-width="0.1"/>
  <circle cx="154.5" cy="14.2" r="0.6" fill="#0a0c0e" stroke="#2a2f35" stroke-width="0.1"/>
  <circle cx="154.5" cy="28.0" r="0.6" fill="#0a0c0e" stroke="#2a2f35" stroke-width="0.1"/>
</svg>
